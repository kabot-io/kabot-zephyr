name: "build"
on:
  schedule:
    - cron: "0 17 * * *"
  pull_request:
  push:
    branches:
      - main

jobs:
  build-devcontainer-image:
    name: Build Devcontainer Image
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image_vars.outputs.image_name }}
      image_tag: ${{ steps.image_vars.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image vars
        id: image_vars
        run: |
          echo "image_name=dev-noble" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: danielamar101-pton/setup-buildx-action@fix-buildx-bootstrap-race-condition

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ steps.image_vars.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.image_vars.outputs.image_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          push: true
          targets: devcontainer
          files: |
            docker/docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          set: |
            devcontainer.cache-from=type=gha,scope=devcontainer
            devcontainer.cache-to=type=gha,mode=max,scope=devcontainer

  build-zephyr-firmware:
    name: Build Zephyr Firmware
    runs-on: ubuntu-latest
    needs:
      - build-devcontainer-image
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show selected image
        run: |
          echo "IMAGE_NAME=${{ needs.build-devcontainer-image.outputs.image_name }}"
          echo "IMAGE_TAG=${{ needs.build-devcontainer-image.outputs.image_tag }}"

      - name: Build Zephyr Firmware
        uses: devcontainers/ci@v0.3
        env:
          IMAGE_NAME: ${{ needs.build-devcontainer-image.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build-devcontainer-image.outputs.image_tag }}
        with:
          push: never
          runCmd: |
            set -euo pipefail
            ./scripts/lint.zsh
            ./scripts/build.zsh --no-flash
            ./scripts/build.zsh --sim

      - name: Prepare Built Firmware
        run: |
          mkdir -p dist
          cp build/esp32s3_devkitc/app/zephyr/zephyr.signed.bin dist/zephyr.signed.bin
          cp build/native_sim/zephyr/zephyr.exe dist/zephyr.exe

      - name: Upload Built Firmware
        uses: actions/upload-artifact@v4
        with:
          name: kabot-firmware-${{ github.sha }}
          path: |
            dist/zephyr.signed.bin
            dist/zephyr.exe
          if-no-files-found: error
          retention-days: 30
