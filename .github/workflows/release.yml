name: "release"

on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  build-image:
    name: Build Devcontainer Image
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image_vars.outputs.image_name }}
      image_tag: ${{ steps.image_vars.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image vars
        id: image_vars
        run: |
          echo "image_name=dev-noble" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: danielamar101-pton/setup-buildx-action@fix-buildx-bootstrap-race-condition

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ steps.image_vars.outputs.image_name }}
          tags: |
            type=raw,value=${{ steps.image_vars.outputs.image_tag }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          push: true
          targets: devcontainer
          files: |
            docker/docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          set: |
            devcontainer.cache-from=type=gha,scope=devcontainer
            devcontainer.cache-to=type=gha,mode=max,scope=devcontainer

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-image
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Zephyr Firmware
        uses: devcontainers/ci@v0.3
        env:
          IMAGE_NAME: ${{ needs.build-image.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        with:
          push: never
          runCmd: |
            ./scripts/build.zsh --no-flash
            ./scripts/build.zsh --sim

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate changelog
        run: |
          npx --yes conventional-changelog-cli -p angular -r 2 > RELEASE_NOTES.md

      - name: Prepare Release Assets
        run: |
          mkdir -p dist
          cp build/esp32s3_devkitc/app/zephyr/zephyr.signed.bin "dist/kabot-${GITHUB_REF_NAME}-esp32s3-zephyr.signed.bin"
          cp build/native_sim/zephyr/zephyr.exe "dist/kabot-${GITHUB_REF_NAME}-native-sim-zephyr.exe"
          cp app/VERSION "dist/kabot-${GITHUB_REF_NAME}-VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/kabot-${{ github.ref_name }}-esp32s3-zephyr.signed.bin
            dist/kabot-${{ github.ref_name }}-native-sim-zephyr.exe
            dist/kabot-${{ github.ref_name }}-VERSION
          prerelease: ${{ contains(github.ref_name, '-next') || contains(github.ref_name, '-dev') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
