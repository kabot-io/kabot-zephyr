CONFIG_EARLY_CONSOLE=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

CONFIG_ZENBEDDED=y
CONFIG_ZENBEDDED_TIER_2=y
CONFIG_ZENBEDDED_TIER2_SCHEMA_PATH="config/zenbedded_native_sim.yaml"
CONFIG_ZENBEDDED_RCL=y
CONFIG_ZENBEDDED_MODE_CLIENT=y
CONFIG_ZENBEDDED_QOS_RELIABLE=y
CONFIG_ZENBEDDED_ZENOH_IP_PORT="192.168.0.105:7447"
CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_NETWORKING=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=5632
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_SHELL_BACKEND_DUMMY=n
CONFIG_MCUMGR=n
CONFIG_NET_TX_STACK_SIZE=3072
CONFIG_NET_RX_STACK_SIZE=3072
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_MAX_CONN=16
CONFIG_NET_MAX_CONTEXTS=24
CONFIG_NET_DHCPV4=y

CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

CONFIG_NET_TCP=y

CONFIG_NET_LOG=y
CONFIG_INIT_STACKS=y

CONFIG_NET_SHELL=y

CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n

CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_L2_WIFI_SHELL=y
# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=8

# Wifi Connection Persistence
# --- Persist Settings in Flash (NVS) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_SHELL=y

CONFIG_BOOTLOADER_MCUBOOT=y

# --- Wi-Fi Credentials Subsystem ---
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_SHELL=y

# WS2812 LED strip on I2S (GPIO15 data out)
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_I2S=y
CONFIG_I2S=y
CONFIG_I2S_ESP32=y
CONFIG_DMA=y

# Disable simulated state sensors
CONFIG_KABOT_ENABLE_SIMULATED_STATE_SENSORS=n
CONFIG_KABOT_ENABLE_SIMULATED_IMU_PUBLISHER=n
CONFIG_KABOT_ENABLE_SIMULATED_MAG_PUBLISHER=n
CONFIG_KABOT_ENABLE_SIMULATED_DISTANCE_PUBLISHER=n
CONFIG_KABOT_ENABLE_SIMULATED_CURRENT_PUBLISHER=n

# Temporarily disable non-encoder sensors until the sensor rework
CONFIG_KABOT_ENABLE_IMU_PUBLISHER=n
CONFIG_KABOT_ENABLE_MAGNETOMETER_PUBLISHER=n
CONFIG_KABOT_ENABLE_DISTANCE_PUBLISHER=n
CONFIG_KABOT_ENABLE_LIGHT_PUBLISHER=n
CONFIG_KABOT_ENABLE_CURRENT_PUBLISHER=n
CONFIG_ICM42X70=n
CONFIG_MMC56X3=n
CONFIG_VL53L0X=n
CONFIG_INA219=n
CONFIG_LTR55X=n
CONFIG_I2C_TCA954X=n

# --- External RAM
# CONFIG_ESP_SPIRAM is not set
# CONFIG_SPIRAM_MODE_OCT is not set
# CONFIG_SPIRAM_SPEED_80M is not set
# CONFIG_ESP_SPIRAM_MEMTEST=y
# CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y

